<div class="navbar-container">
  @if (user?.nome) {
  <p class="navbar-container--text-header">Bem vindo, {{ user.nome }}!</p>
  }
  <nav class="navbar-container--nav">
    <ul class="navbar-container--nav--list">
      @for (item of componentsLaterais; track $index) {
      <a [href]="item.route" routerLinkActive="active">
        <li><img [src]="item.icon" [alt]="item.alt" />{{ item.label }}</li>
      </a>
      }
    </ul>
    <button class="navbar-container--nav--button" type="button" (click)="sairDoSistema()">
      Sair do sistema
    </button>
  </nav>
</div>
