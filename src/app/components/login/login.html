<main>
  <div class="modalLogin">
    <div class="titulo">
      <p>Login</p>
    </div>
    <form class="formulario" (ngSubmit)="enviar()" #form="ngForm" novalidate>
      <div>
        <div class="campos_login">
          <label>Digite seu email:</label>
          <input type="email" name="email" [(ngModel)]="email" required />
        </div>
        <div class="campos_login">
          <label>Digite sua senha:</label>
          <input type="password" name="senha" [(ngModel)]="senha" required />
        </div>
      </div>
      <div class="botoes">
        <button class="botaoLogar" type="submit">Logar</button>
        <button class="botaoRegistrar" type="button" (click)="registrarUser()">Registrar</button>
      </div>
    </form>
  </div>
  <app-loading-component [isLoading]="isLoadingModal"></app-loading-component>
  <app-modal
    [isVisible]="modalAberto"
    title="Erro ao logar!"
    (close)="modalAberto = false"
    [error]="true"
  >
    <p>{{ erroMensagem }}</p>
  </app-modal>
</main>
