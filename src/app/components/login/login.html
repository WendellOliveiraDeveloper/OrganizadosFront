<main>
  <div class="modalLogin">
    <div class="titulo">
      <p>Login</p>
    </div>
    <form class="formulario" (ngSubmit)="enviar()" #form="ngForm" novalidate>
      <div class="campos_login">
        <div class="campos_login--input">
          <app-label-component
            class="campos_login--input--label"
            text="Email"
            for="emailLogin"
            [required]="true"
          />
          <input
            class="bg-white w-[400px] h-[30px]"
            type="email"
            name="email"
            id="emailLogin"
            [(ngModel)]="email"
            required
          />
        </div>
        <div class="campos_login--input">
          <app-label-component
            class="campos_login--input--label"
            text="Senha"
            for="senhaLogin"
            [required]="true"
          />
          <input
            class="bg-white w-[400px] h-[30px]"
            type="password"
            name="senha"
            id="senhaLogin"
            [(ngModel)]="senha"
            required
          />
        </div>
      </div>
      <div class="botoes">
        <button class="botaoLogar" type="submit">Logar</button>
        <button class="botaoRegistrar" type="button" (click)="registrarUser()">Registrar</button>
      </div>
      <div
        class="formulario--forget_password flex justify-center p-[40px] text-[16px] text-blue-500"
      >
        <button type="button" (click)="togleViewModalForgetPassword()">Esqueci minha senha</button>
      </div>
    </form>
  </div>
  <app-loading-component [isLoading]="isLoadingModal"></app-loading-component>
  <app-modal
    [isVisible]="modalSucesso"
    title="Sucesso ao logar!"
    [sucess]="true"
    (close)="modalSucesso = false"
  >
    <p>{{ sucessoMensagem }}</p>
  </app-modal>
  <app-modal
    [isVisible]="modalAberto"
    title="Erro ao logar!"
    (close)="modalAberto = false"
    [error]="true"
  >
    <p>{{ erroMensagem }}</p>
  </app-modal>
  <app-modal
    [isVisible]="isModalEsqueciSenha"
    title="Cadastrar nova senha"
    (close)="isModalEsqueciSenha = false"
  >
    <form
      class="form_alterar_senha flex flex-col items-center"
      #formSenha="ngForm"
      (ngSubmit)="alterarSenha()"
    >
      <div class="form_alterar_senha--campos">
        <app-label-component
          class="text-[17px]"
          text="Digite sua nova senha"
          for="newUserPassword"
          [required]="true"
        />
        <div>
          <input
            class="w-[200px]"
            [type]="mostrarSenha ? 'text' : 'password'"
            id="newUserPassword"
            name="novaSenha"
            [(ngModel)]="novaSenha"
          />
          <button type="button" (click)="togleViewPassword()">
            <fa-icon
              class="eye-icon icon"
              [matTooltip]="mostrarSenha ? 'Ocultar senha' : 'Mostrar senha'"
              matTooltipPosition="right"
              [icon]="mostrarSenha ? faEyeSlash : faEye"
            ></fa-icon>
          </button>
        </div>
      </div>
      <div class="form_alterar_senha--button_alterar flex justify-center">
        <button type="submit">Alterar senha</button>
      </div>
    </form>
  </app-modal>
</main>
