<main class="pagina-registro">
  <div class="campo-principal h-[430px] w-[700px] overflow-y-auto">
    <div class="cabecalho">
      <p>Registre-se</p>
    </div>
    <div class="formulario flex justify-center">
      <form (ngSubmit)="enviaRegistro()" #form="ngForm">
        <div class="campos">
          <app-label-component
            class="campos--label"
            text="Nome"
            for="nomeRegistro"
            [required]="true"
          />
          <input
            class="campos--input bg-white h-[30px]"
            type="text"
            [(ngModel)]="nome"
            name="nome"
            id="nomeRegistro"
            required
          />
        </div>
        <div class="campos">
          <app-label-component
            class="campos--label"
            text="Email"
            for="emailRegistro"
            [required]="true"
          />
          <input
            class="campos--input bg-white h-[30px]"
            type="email"
            [(ngModel)]="email"
            name="email"
            id="emailRegistro"
            required
          />
        </div>
        <div class="campos">
          <app-label-component class="campos--label" text="Telefone" for="telefoneRegistro" />
          <input
            class="campos--input bg-white h-[30px]"
            type="tel"
            [(ngModel)]="telefone"
            name="telefone"
            id="telefoneRegistro"
            required
          />
        </div>
        <div class="campos">
          <app-label-component
            class="campos--label"
            text="Senha"
            for="senhaRegistro"
            [required]="true"
          />
          <div>
            <input
              class="campos--input bg-white h-[30px]"
              [type]="mostrarSenha ? 'text' : 'password'"
              [(ngModel)]="senha"
              name="senha"
              id="senhaRegistro"
              required
            />
            <button class="icon-eye" type="button" (click)="mostrarIcon()">
              <fa-icon class="icon" [icon]="mostrarSenha ? faEye : faEyeSlash"></fa-icon>
            </button>
          </div>
        </div>
        <div class="botao flex w-[100%]">
          <button class="botao--registrar" type="submit">Registrar</button>
          <button class="botao--retornar" type="button" (click)="voltarPaginaLogin()">
            Voltar
          </button>
        </div>
      </form>
    </div>
  </div>
  <app-loading-component [isLoading]="isLoadingModal"></app-loading-component>
  <app-modal
    [isVisible]="modalSucessoAberto"
    title="Usuário registrado com sucesso!"
    [sucess]="true"
    (close)="modalSucessoAberto = false"
  >
    <p>{{ mensagemSucesso }}</p>
  </app-modal>
  <app-modal
    [isVisible]="modalErroAberto"
    title="Erro ao registrar"
    [error]="true"
    (close)="modalErroAberto = false"
  >
    <p>{{ erroMensagem }}</p>
  </app-modal>
</main>
